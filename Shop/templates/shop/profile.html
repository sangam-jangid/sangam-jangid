{% load static %}
{% load tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Profile | RoyalStore</title>
  <link rel="stylesheet" href="{% static 'output.css' %}">
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center p-4 relative">

  <!-- Background Image -->
  <img src="{% static 'gg.jpg' %}" alt="" class="fixed top-0 left-0 w-full h-full object-cover -z-10">

  <!-- Profile Card -->
  <div class="bg-white/10 backdrop-blur-sm rounded-3xl p-6 sm:p-10 shadow-2xl w-full max-w-[500px] sm:max-w-lg border border-white/20">

    <!-- Profile Info -->
    <div class="flex flex-col items-center space-y-6">
      {% if profile.picture %}
      <img src="{{ profile.picture.url }}" alt="" class="rounded-lg w-36 h-36 object-cover ring-4 ring-indigo-500 shadow-lg">
      {% else %}
      <img src="{% static 'default_avatar.png' %}" alt="" class="rounded-full w-36 h-36 object-cover ring-4 ring-indigo-500 shadow-lg">
      {% endif %}

      <h2 class="text-3xl sm:text-4xl font-extrabold tracking-wide">{{ user.username }}</h2>
      <p class="text-base sm:text-lg text-gray-300 break-all">{{ user.email }}</p>
    </div>

    <!-- Upload Form -->
    <form method="POST" enctype="multipart/form-data" class="mt-8 space-y-6">
      {% csrf_token %}

      <div>
        <label class=" text-gray-300 text-lg font-medium mb-2">Upload New Profile Photo</label>
        <input type="file" name="image" accept="image/*"
               class=" w-full bg-white/5 border border-white/20 rounded-lg p-3 text-base text-white">
      </div>

      <div>
        <label class=" text-gray-300 text-lg font-medium mb-2">Address</label>
        <textarea name="address" rows="3"
                  class="w-full p-3 rounded-lg bg-white/5 border border-white/20 text-gray-200 placeholder-gray-400 text-base"
                  placeholder="Write something cool about yourself...">{{ profile.address }}</textarea>
      </div>

      <button type="submit"
              class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-purple-600 hover:to-indigo-500 text-white font-semibold rounded-xl py-3 text-lg transition-all duration-300 shadow-lg">
        ✨ Update Profile
      </button>
    </form>

    <a href="{% url 'shop' %}"
       class="block text-center text-base text-black mt-6 hover:text-indigo-400 transition">← Back to Home</a>

  </div>

</body>
</html>
