{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <title>Royal Chat Room</title>
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
  <style>
    .fade-in {
      animation: fadeIn 0.5s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="h-screen w-screen bg-black flex items-center justify-center">

  <!-- Full black container -->
  <div class="h-full w-full bg-black flex items-center justify-center">

    <!-- Centered chat box -->
    <div class="w-full max-w-xl h-[90vh] bg-black border border-white/20 rounded-2xl shadow-2xl flex flex-col overflow-hidden">

      <!-- Messages scroll area -->
      <div id="chat-box" class="flex-grow overflow-y-auto p-4 space-y-3">

        {% for message in messages %}
          <div class="fade-in">
            <div class="p-4 rounded-2xl backdrop-blur-md transition
            {% if message.sender == user %}
              ml-auto bg-gradient-to-r from-purple-600 to-pink-500 text-white
            {% else %}
              bg-white/10 text-white
            {% endif %} hover:scale-[1.015] duration-300 max-w-[75%]">

              <div class="flex justify-between items-center mb-1">
                <p class="text-sm font-semibold">{{ message.sender.username }}</p>
                <p class="text-xs text-gray-300">{{ message.timestamp|date:"H:i" }}</p>
              </div>

              <p class="text-lg leading-relaxed break-words">{{ message.content }}</p>

              {% if user.is_authenticated and message.sender == user or user.is_superuser %}
                <form method="post" action="{% url 'delete_message' message.id %}" class="text-right mt-2">
                  {% csrf_token %}
                  <button type="submit" class="text-red-300 hover:text-red-500 text-sm">🗑️</button>
                </form>
              {% endif %}
            </div>
          </div>
        {% endfor %}

      </div>

      <!-- Input form at bottom -->
      <form method="post" action="{% url 'send_message' %}" class="p-3 bg-black flex gap-2 border-t border-white/20">
        {% csrf_token %}
        <input name="message" placeholder="Type your message..."
          class="flex-grow min-w-0 p-3 rounded-full bg-white/90 text-black focus:outline-none focus:ring-2 focus:ring-purple-500 placeholder-gray-500"
          required />
        <button type="submit"
          class="px-5 py-3 rounded-full bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold hover:scale-105 transition shadow-lg">
          Send
        </button>
      </form>

    </div>
    <!-- End of chat box -->

  </div>
  <!-- End of black container -->

  <script>
    function scrollToBottom() {
      const chatBox = document.getElementById('chat-box');
      chatBox.scrollTo({
        top: chatBox.scrollHeight,
        behavior: 'smooth'
      });
    }
    window.onload = scrollToBottom;
  </script>

</body>
</html>
