{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <title>Royal Chat Room</title>
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
  <style>
    .fade-in {
      animation: fadeIn 0.5s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-gradient-to-tr from-black via-purple-900 to-indigo-900 h-screen flex flex-col">

  <div class="flex-grow overflow-y-scroll p-5 space-y-3" id="chat-box">
    {% for message in messages %}
      <div class="fade-in">
        <div class="p-4 rounded-2xl shadow-xl backdrop-blur-md transition
        {% if message.sender == user %}
          ml-auto bg-gradient-to-r from-purple-600 to-pink-500 text-white
        {% else %}
          bg-white/10 text-white
        {% endif %} hover:scale-[1.015] duration-300 max-w-lg">

          <div class="flex justify-between items-center mb-1">
            <p class="text-sm font-semibold">{{ message.sender.username }}</p>
            <p class="text-xs text-gray-300">{{ message.timestamp|date:"H:i" }}</p>
          </div>

          <p class="text-lg leading-relaxed">{{ message.content }}</p>

          {% if user.is_authenticated and message.sender == user or user.is_superuser %}
            <form method="post" action="{% url 'delete_message' message.id %}" class="text-right mt-2">
              {% csrf_token %}
              <button type="submit" class="text-red-300 hover:text-red-500 text-sm">🗑️</button>
            </form>
          {% endif %}
        </div>
      </div>
    {% endfor %}
  </div>

  <form method="post" action="{% url 'send_message' %}" class="p-4 bg-black/40 backdrop-blur flex gap-3 border-t border-white/20">
    {% csrf_token %}
    <input name="message" placeholder="Type your message..."
      class="flex-grow p-3 rounded-full bg-white/90 text-black focus:outline-none focus:ring-2 focus:ring-purple-500 transition placeholder-gray-500" />
    <button type="submit"
      class="px-6 py-3 rounded-full bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold hover:scale-105 transition shadow-lg">
      Send
    </button>
  </form>

  <script>
    function scrollToBottom() {
      const chatBox = document.getElementById('chat-box');
      chatBox.scrollTo({
        top: chatBox.scrollHeight,
        behavior: 'smooth'
      });
    }
    window.onload = scrollToBottom;
  </script>

</body>
</html>
